name: "2 · Test Planning"

# ─────────────────────────────────────────────────────────
# STLC Phase: Test Planning
# Kane CLI:   context review + cover gaps
#
# What it demonstrates:
#   - Human review gate: approve, edit, or reject use-cases
#   - The gap analysis showing what's missing
#   - Risk-ranked prioritization of what to test first
#
# What the prospect should notice:
#   - Nothing moves forward without human approval
#   - The coverage report replaces the RTM spreadsheet
#   - Gaps come with ready-to-paste fix commands
#
# Prerequisites:
#   Run workflow 1 (Requirements Analysis) first
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: 'approve-all = auto-approve, manual = interactive verdicts file'
        required: true
        default: 'approve-all'
        type: choice
        options: [approve-all, manual]

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  test-planning:
    name: Review & Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli && kane-cli --version

      - name: Authenticate
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Restore context graph
        uses: actions/cache@v4
        with:
          path: .context/
          key: context-${{ hashFiles('docs/**') }}-${{ github.run_number }}
          restore-keys: context-${{ hashFiles('docs/**') }}-

      # ── SHOW PENDING ITEMS ─────────────────────────────
      - name: "Pending: Show items awaiting review"
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Items pending review"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kane-cli context list --inferred 2>/dev/null || echo "No unreviewed items"

      # ── REVIEW ─────────────────────────────────────────
      - name: "Review: Approve extracted use-cases"
        if: inputs.review_mode == 'approve-all'
        run: |
          echo "✅ Auto-approving all extracted use-cases"
          kane-cli context review \
            --approve-all \
            --mode ci \
            || echo "All items already reviewed"

      - name: "Review: Apply verdicts from file"
        if: inputs.review_mode == 'manual'
        run: |
          if [ -f "docs/verdicts.json" ]; then
            echo "📋 Applying verdicts from docs/verdicts.json"
            kane-cli context review --verdicts docs/verdicts.json
          else
            echo "⚠️  No docs/verdicts.json found"
            echo "   Create one with format:"
            echo '   [{"ref": "uc-xxx", "resolution": "approved"}]'
            exit 1
          fi

      # ── COVERAGE GAPS ──────────────────────────────────
      - name: "Plan: Show coverage gaps (what to test first)"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Coverage gaps — risk-ranked to-do list"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli cover gaps --stage design 2>/dev/null \
            || echo "No gaps found — all use-cases have test coverage"

      # ── POST-REVIEW STATUS ─────────────────────────────
      - name: "Status: Full context graph after review"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Context graph — post-review"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli context list

      - name: Save outputs
        run: |
          kane-cli context list --json > context-list-reviewed.json
          kane-cli cover gaps --stage design --json > design-gaps.json 2>/dev/null || echo "[]" > design-gaps.json

      - name: Generate visual graph
        run: kane-cli context view --output context-graph.html 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2-test-planning-${{ github.run_number }}
          retention-days: 30
          path: |
            context-list-reviewed.json
            design-gaps.json
            context-graph.html
            .context/
