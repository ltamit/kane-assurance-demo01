name: "Kane CLI Assurance · STLC Demo"

# ─────────────────────────────────────────────────────────
# All 7 STLC phases in one workflow, on YOUR machine.
# Runs on a self-hosted Windows runner with Git Bash.
# Chrome opens VISIBLY on your desktop for phases 4-5.
#
# Prerequisites on your Windows machine:
#   1. Self-hosted runner configured and running (.\run.cmd)
#   2. Node.js 24+ installed
#   3. Google Chrome installed
#   4. Kane CLI: npm install -g @testmuai/kane-cli
#   5. jq: choco install jq
#   6. Git Bash (comes with Git for Windows)
#
# Trigger: Actions → Kane CLI Assurance · STLC Demo → Run workflow
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Which phases to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - 1-requirements
          - 1-to-3
          - 4-to-5
          - 6-coverage
          - 7-maintenance
      source_file:
        description: 'PRD file path'
        required: true
        default: 'docs/prd-checkout.md'
      source_id:
        description: 'Source ID'
        required: true
        default: 'prd-checkout'
      app_url:
        description: 'ShopEasy app URL (needed for phases 4-5, "skip" to skip)'
        required: true
        default: 'skip'
      max_tests:
        description: 'Max tests per use-case'
        required: true
        default: '3'
      v2_prd:
        description: 'Updated PRD for phase 7 maintenance demo'
        required: true
        default: 'docs/prd-checkout-v2.md'

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  stlc-demo:
    name: "STLC Demo · ${{ inputs.phases }}"
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"

    steps:
      # ── Setup ──────────────────────────────────────────
      - uses: actions/checkout@v4

      - name: "Setup · Verify prerequisites"
        run: |
          echo "── Checking prerequisites ──"
          echo "Node: $(node --version 2>/dev/null || echo 'NOT FOUND')"
          echo "npm: $(npm --version 2>/dev/null || echo 'NOT FOUND')"
          echo "jq: $(jq --version 2>/dev/null || echo 'NOT FOUND')"
          echo "Kane CLI: $(kane-cli --version 2>/dev/null || echo 'NOT FOUND')"
          echo "OS: $(uname -s) $(uname -m)"
          echo ""

      - name: "Setup · Install/update Kane CLI"
        run: |
          npm install -g @testmuai/kane-cli
          kane-cli --version
          kane-cli install skill || true

      - name: "Setup · Authenticate"
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      # Restore .context/ from cache for phases that need prior state
      - name: "Setup · Restore context graph from cache"
        if: >-
          inputs.phases == '4-to-5' ||
          inputs.phases == '6-coverage' ||
          inputs.phases == '7-maintenance'
        uses: actions/cache@v4
        with:
          path: |
            .context/
            .testmuai/
          key: stlc-context-${{ inputs.source_id }}-${{ github.run_number }}
          restore-keys: |
            stlc-context-${{ inputs.source_id }}-

      # ─────────────────────────────────────────────────────
      # PHASE 1: Requirements Analysis
      # ─────────────────────────────────────────────────────
      - name: "Phase 1 · Ingest PRD"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-requirements' ||
          inputs.phases == '1-to-3'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 1: Requirements Analysis"
          echo "  Ingesting: ${{ inputs.source_file }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli context ingest "./${{ inputs.source_file }}" \
            --as "${{ inputs.source_id }}" \
            --mode ci

      - name: "Phase 1 · Extract use-cases"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-requirements' ||
          inputs.phases == '1-to-3'
        run: |
          kane-cli context extract \
            --mode override \
            --source "${{ inputs.source_id }}"

      - name: "Phase 1 · Results"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-requirements' ||
          inputs.phases == '1-to-3'
        run: |
          echo ""
          echo "── Extracted use-cases ──"
          kane-cli context list

      # ─────────────────────────────────────────────────────
      # PHASE 2: Test Planning
      # ─────────────────────────────────────────────────────
      - name: "Phase 2 · Debug — inspect context list JSON"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 2: Test Planning"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "=== Raw JSON from kane-cli context list --json ==="
          kane-cli context list --json 2>/dev/null || echo "command failed"
          echo ""

          kane-cli context list --json > all-items.json 2>/dev/null || echo "[]" > all-items.json

          echo "=== First item (full structure) ==="
          jq '.[0]' all-items.json 2>/dev/null || echo "jq parse failed"
          echo ""

          echo "=== All keys in first item ==="
          jq '.[0] | keys' all-items.json 2>/dev/null || echo "no keys found"
          echo ""

          echo "=== All refs/ids/slugs ==="
          jq -r '.[] | "ref=\(.ref // "null") id=\(.id // "null") slug=\(.slug // "null") name=\(.name // "null") type=\(.type // "null")"' all-items.json 2>/dev/null || echo "field extraction failed"
          echo ""

      - name: "Phase 2 · Review and approve use-cases"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          # Build verdicts trying every possible field name
          jq '[.[] | {ref: (.ref // .id // .slug // .name), resolution: "approved"} | select(.ref != null)]' \
            all-items.json > verdicts.json 2>/dev/null || echo "[]" > verdicts.json

          echo "=== Verdicts to submit ==="
          cat verdicts.json
          echo ""

          ITEM_COUNT=$(jq 'length' verdicts.json 2>/dev/null || echo "0")

          if [ "$ITEM_COUNT" -gt "0" ]; then
            echo "Approving $ITEM_COUNT items..."
            kane-cli context review --verdicts verdicts.json \
              || echo "Review completed (some items may already be approved)"
          else
            echo "⚠️ No items to approve — check the debug output above"
          fi

      - name: "Phase 2 · Coverage gaps"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          echo ""
          echo "── Coverage gaps (pre-design) ──"
          kane-cli cover gaps 2>/dev/null || echo "Gaps will appear after test design"

      - name: "Phase 2 · Graph after review"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: kane-cli context list

      # ─────────────────────────────────────────────────────
      # PHASE 3: Test Design
      # ─────────────────────────────────────────────────────
      - name: "Phase 3 · Design tests"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 3: Test Design"
          echo "  Max tests per use-case: ${{ inputs.max_tests }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          MAX=${{ inputs.max_tests }}
          kane-cli context list --json > graph.json 2>/dev/null || echo "[]" > graph.json

          # Try to find use-case refs using multiple field names
          USECASES=$(jq -r '.[] | select(
            .type == "use-case" or
            .type == "use_case" or
            (.ref // "" | startswith("uc-")) or
            (.id // "" | startswith("uc-")) or
            (.slug // "" | startswith("uc-"))
          ) | .ref // .id // .slug // empty' graph.json 2>/dev/null || true)

          if [ -z "$USECASES" ]; then
            echo "Fallback: grep uc- from all fields"
            USECASES=$(jq -r '.[] | .ref // .id // .slug // .name // empty' graph.json 2>/dev/null | grep '^uc-' || true)
          fi

          if [ -z "$USECASES" ]; then
            echo "Last resort: use all items"
            USECASES=$(jq -r '.[] | .ref // .id // .slug // empty' graph.json 2>/dev/null || true)
          fi

          if [ -z "$USECASES" ]; then
            echo "⚠️ No use-cases found. Full graph:"
            cat graph.json
          else
            echo "Use-cases to design:"
            echo "$USECASES"
            echo ""

            TOTAL=$(echo "$USECASES" | wc -l | tr -d ' ')
            CURRENT=0
            for UC in $USECASES; do
              CURRENT=$((CURRENT + 1))
              echo "── [$CURRENT/$TOTAL] Designing: $UC (max $MAX) ──"
              kane-cli design tests \
                --use-case "$UC" \
                --mode override \
                --max "$MAX" \
                --allow-unreviewed \
                || echo "⚠️ Design for $UC completed with warnings"
              echo ""
            done
          fi

      - name: "Phase 3 · Approve designed tests"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          kane-cli context list --json > all-items.json 2>/dev/null || echo "[]" > all-items.json
          jq '[.[] | {ref: (.ref // .id // .slug // .name), resolution: "approved"} | select(.ref != null)]' \
            all-items.json > verdicts.json 2>/dev/null || echo "[]" > verdicts.json
          ITEM_COUNT=$(jq 'length' verdicts.json 2>/dev/null || echo "0")
          if [ "$ITEM_COUNT" -gt "0" ]; then
            kane-cli context review --verdicts verdicts.json || echo "Review completed"
          fi

      - name: "Phase 3 · List test files"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '1-to-3'
        run: |
          echo "── Designed test files ──"
          if [ -d ".testmuai/tests" ]; then
            find .testmuai/tests -name '*_test.md' | sort
            echo "Total: $(find .testmuai/tests -name '*_test.md' | wc -l | tr -d ' ') test files"
          else
            echo "No test files generated"
          fi

      # ─────────────────────────────────────────────────────
      # PHASE 4: Test Development (VISIBLE Chrome!)
      # ─────────────────────────────────────────────────────
      - name: "Phase 4 · Author tests — Chrome opens on your screen"
        if: >-
          (inputs.phases == 'all' || inputs.phases == '4-to-5')
          && inputs.app_url != 'skip'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 4: Test Development"
          echo "  App: ${{ inputs.app_url }}"
          echo "  >>> Chrome will open on your desktop! <<<"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          TESTS=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | head -3)
          if [ -z "$TESTS" ]; then
            echo "No test files — skipping"
            exit 0
          fi
          for TEST in $TESTS; do
            echo "── Authoring: $(basename $TEST) ──"
            kane-cli testmd run "$TEST" \
              --url "${{ inputs.app_url }}" \
              || echo "⚠️ Authoring completed with issues"
            echo ""
          done

      - name: "Phase 4 · Skipped"
        if: >-
          (inputs.phases == 'all' || inputs.phases == '4-to-5')
          && inputs.app_url == 'skip'
        run: echo "Phase 4 skipped — set app_url to a live URL to enable"

      # ─────────────────────────────────────────────────────
      # PHASE 5: Test Execution (VISIBLE Chrome!)
      # ─────────────────────────────────────────────────────
      - name: "Phase 5 · Batch replay — Chrome opens on your screen"
        if: >-
          (inputs.phases == 'all' || inputs.phases == '4-to-5')
          && inputs.app_url != 'skip'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 5: Test Execution"
          echo "  >>> Chrome will open on your desktop! <<<"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli testrun run \
            --match 't-' \
            --url "${{ inputs.app_url }}" \
            || echo "⚠️ Some tests may have failed"

      - name: "Phase 5 · Skipped"
        if: >-
          (inputs.phases == 'all' || inputs.phases == '4-to-5')
          && inputs.app_url == 'skip'
        run: echo "Phase 5 skipped — set app_url to a live URL to enable"

      # ─────────────────────────────────────────────────────
      # PHASE 6: Coverage & Reporting
      # ─────────────────────────────────────────────────────
      - name: "Phase 6 · Coverage report"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '6-coverage'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 6: Coverage & Reporting"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "── Coverage panel ──"
          kane-cli cover 2>/dev/null || echo "No evidence packs yet"
          echo ""
          echo "── Coverage gaps ──"
          kane-cli cover gaps 2>/dev/null || echo "No gaps to report"

      - name: "Phase 6 · Save JSON"
        if: >-
          inputs.phases == 'all' ||
          inputs.phases == '6-coverage'
        run: |
          kane-cli cover --json > coverage.json 2>/dev/null || echo "{}" > coverage.json
          kane-cli cover gaps --json > coverage-gaps.json 2>/dev/null || echo "[]" > coverage-gaps.json

      # ─────────────────────────────────────────────────────
      # PHASE 7: Maintenance
      # ─────────────────────────────────────────────────────
      - name: "Phase 7 · Reconcile PRD change"
        if: inputs.phases == '7-maintenance'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 7: Maintenance"
          echo "  Reconciling: ${{ inputs.v2_prd }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          echo "── BEFORE reconcile ──"
          kane-cli context list 2>/dev/null || echo "Empty graph"
          echo ""

          kane-cli maintain reconcile \
            --from "./${{ inputs.v2_prd }}" \
            --source-id "${{ inputs.source_id }}" \
            --mode override \
            || echo "⚠️ Reconcile completed with warnings"

          echo ""
          echo "── AFTER reconcile ──"
          kane-cli context list

          echo ""
          echo "── Coverage gaps after reconcile ──"
          kane-cli cover gaps 2>/dev/null || echo "No gaps"

      # ── Save state & artifacts ──────────────────────────
      - name: "Generate context graph"
        if: always()
        run: kane-cli context view --output context-graph.html 2>/dev/null || true

      - name: "Save to cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .context/
            .testmuai/
          key: stlc-context-${{ inputs.source_id }}-${{ github.run_number }}

      - name: "Summary"
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Run complete: ${{ inputs.phases }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlc-${{ inputs.phases }}-${{ github.run_number }}
          retention-days: 30
          path: |
            coverage.json
            coverage-gaps.json
            context-graph.html
            all-items.json
            verdicts.json
            graph.json
            .context/
            .testmuai/
