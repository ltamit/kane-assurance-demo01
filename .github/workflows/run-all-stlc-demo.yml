name: "Kane CLI Assurance - Design & Maintenance (CI)"

# ---------------------------------------------------------
# Phases 1, 2, 3, 7 only - the design layer. No Chrome, no
# live app needed, fully unattended-safe on the self-hosted
# runner. Phases 4-6 (author, execute, coverage) run LOCALLY
# via Claude Code instead - see docs/local-phases-4-6.md.
#
# Both this workflow and the local runbook operate on the
# SAME working directory on this machine (the runner's own
# workspace), so .context/ and .testmuai/ carry over between
# a CI run here and a local Claude Code session there with no
# sync step needed.
#
# ONE-TIME SETUP on your Windows machine (as Administrator):
#   1. Self-hosted runner configured and running (.\run.cmd)
#   2. Node.js 24+ installed and in PATH
#   3. Kane CLI: npm install -g @testmuai/kane-cli
#   4. Add Git Bash to system PATH:
#        $gitBashPath = "C:\Program Files\Git\bin"
#        [Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";$gitBashPath", "Machine")
#   5. Install jq:
#        choco install jq -y
#   6. Restart the runner so it picks up the new PATH
#
# Trigger: Actions -> Kane CLI Assurance - Design & Maintenance (CI) -> Run workflow
# ---------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Which phase to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '7'
      source_file:
        description: 'PRD file path'
        required: true
        default: 'docs/prd-checkout.md'
      source_id:
        description: 'Source ID'
        required: true
        default: 'prd-checkout'
      max_tests:
        description: 'Max tests per use-case (number only)'
        required: true
        default: '3'
      target_usecase:
        description: 'Phase 3 only: design ONE use-case (e.g. uc-1). Blank = all use-cases (can take 30-40+ min for a full PRD - use one use-case for live demos)'
        required: false
        default: ''
      v2_prd:
        description: 'Updated PRD for phase 7 maintenance demo'
        required: true
        default: 'docs/prd-checkout-v2.md'

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  stlc-design:
    name: "Design & Maintenance - ${{ inputs.phases }}"
    runs-on: self-hosted
    timeout-minutes: 90

    defaults:
      run:
        # NOTE: deliberately NOT using -e (errexit). This workflow relies on
        # inspecting exit codes after commands that are EXPECTED to sometimes
        # return non-zero (e.g. kane-cli design tests returning 3 for "paused
        # and resumable", or a command completing with warnings). Under -e,
        # bash aborts the entire step the instant such a command returns
        # non-zero - before the script ever reaches its own exit-code checks.
        #
        # If plain 'bash' isn't resolvable on this runner's PATH, replace the
        # line below with the 8.3 short path to bash.exe (no spaces), e.g.:
        #   shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -o pipefail {0}'
        # Get the short path by running this in PowerShell on the runner machine:
        #   $fso = New-Object -ComObject Scripting.FileSystemObject
        #   $fso.GetFile("C:\Program Files\Git\bin\bash.exe").ShortPath
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -o pipefail {0}'

    steps:
      # -- Setup ------------------------------------------
      - uses: actions/checkout@v4
        with:
          # CRITICAL for self-hosted runners: actions/checkout defaults to
          # running 'git clean -ffdx' before checkout, which deletes ALL
          # untracked files - including .context/ and .testmuai/ - at the
          # start of every job. clean: false lets the runner's own
          # persistent disk be the source of truth, since this machine
          # isn't torn down between jobs (and Claude Code needs that same
          # persistent state to pick up where CI left off).
          clean: false

      - name: "Setup - Verify prerequisites"
        run: |
          echo "-- Checking prerequisites --"
          echo "Node: $(node --version 2>/dev/null || echo 'NOT FOUND')"
          echo "npm: $(npm --version 2>/dev/null || echo 'NOT FOUND')"
          echo "jq: $(jq --version 2>/dev/null || echo 'NOT FOUND')"
          echo "Kane CLI: $(kane-cli --version 2>/dev/null || echo 'NOT FOUND')"
          echo "Shell: $(bash --version | head -1)"
          echo ""

      # - name: "Setup - Install/update Kane CLI"
      #   run: |
      #     npm install -g @testmuai/kane-cli
      #     kane-cli --version
      #     kane-cli install skill || echo "Skill install skipped"

      # - name: "Setup - Authenticate"
      #   run: |
      #     kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" || true

      - name: "Setup - Validate max_tests is numeric"
        if: inputs.phases == 'all' || inputs.phases == '3'
        run: |
          MAX="${{ inputs.max_tests }}"
          if ! [[ "$MAX" =~ ^[0-9]+$ ]]; then
            echo "ERROR: max_tests must be a plain number, got: $MAX"
            exit 1
          fi

      # NOTE: no cache restore/save steps here. See CI history: on this
      # self-hosted runner, 'clean: false' on checkout already lets
      # .context/ and .testmuai/ persist naturally on disk between runs -
      # that's the single source of truth. actions/cache extracts its
      # archive ON TOP of existing files, so it was silently overwriting
      # freshly-edited variable values with stale snapshots. Do not re-add
      # it unless this workflow moves to a runner whose disk does not
      # persist between jobs.

      # ===========================================================
      # PHASE 1: Requirements Analysis
      # kane-cli: context ingest + context extract
      # ===========================================================
      - name: "Phase 1 - Ingest PRD"
        if: inputs.phases == 'all' || inputs.phases == '1'
        run: |
          echo ""
          echo "================================================"
          echo "  Phase 1: Requirements Analysis"
          echo "  Ingesting: ${{ inputs.source_file }}"
          echo "================================================"
          echo ""

          kane-cli context ingest "./${{ inputs.source_file }}" --as "${{ inputs.source_id }}" --mode ci
          ingest_exit=$?

          # kane-cli on Windows can crash on process exit (a known Node/libuv
          # assertion) AFTER the actual ingest already succeeded. Don't trust
          # the exit code alone - verify the source actually landed in the graph.
          kane-cli context list --json > verify-ingest.json 2>verify-ingest-err.log
          landed=$(jq -s --arg sid "${{ inputs.source_id }}" \
            '[.[] | select(.id == $sid or .ref == $sid)] | length' verify-ingest.json 2>/dev/null || echo "0")

          if [ "$landed" -gt 0 ]; then
            if [ "$ingest_exit" -ne 0 ]; then
              echo "NOTE: kane-cli exited $ingest_exit (likely the known Windows process-exit crash), but the source landed successfully - continuing"
            else
              echo "Ingest confirmed - source '${{ inputs.source_id }}' is in the graph"
            fi
          else
            echo "ERROR: Ingest failed - '${{ inputs.source_id }}' not found in the graph after ingest"
            echo "Graph contents:"
            cat verify-ingest.json
            exit 1
          fi

      - name: "Phase 1 - Extract use-cases"
        if: inputs.phases == 'all' || inputs.phases == '1'
        run: |
          kane-cli context extract --mode override --source "${{ inputs.source_id }}"
          if [ $? -ne 0 ]; then
            echo "Extract completed with warnings"
          fi

      - name: "Phase 1 - Results"
        if: inputs.phases == 'all' || inputs.phases == '1'
        run: |
          echo ""
          echo "-- Extracted use-cases --"
          kane-cli context list || true

      # ===========================================================
      # PHASE 2: Test Planning
      # kane-cli: context review + cover gaps
      # ===========================================================
      - name: "Phase 2 - Review and approve use-cases"
        if: inputs.phases == 'all' || inputs.phases == '2'
        run: |
          echo ""
          echo "================================================"
          echo "  Phase 2: Test Planning"
          echo "================================================"
          echo ""

          kane-cli context list --json > all-items.json 2>graph-stderr.log

          echo "=== Raw JSON (NDJSON - one object per line) ==="
          cat all-items.json
          echo ""

          # kane-cli --json emits NDJSON. jq's slurp mode (-s) reads multiple
          # newline-separated JSON values and combines them into one array.
          # Only items with trust == "derived" are actually awaiting review -
          # sources have trust "-", already-approved items are "trusted".
          jq -s '[.[] | select(.trust == "derived") | {ref: (.ref // .id // .slug // .name), resolution: "approved"}]' \
            all-items.json > verdicts.json 2>/dev/null || echo "[]" > verdicts.json

          item_count=$(jq 'length' verdicts.json 2>/dev/null || echo "0")

          if [ "$item_count" -gt 0 ]; then
            echo "Approving $item_count items..."
            cat verdicts.json
            kane-cli context review --verdicts verdicts.json
            if [ $? -ne 0 ]; then
              echo "Review completed (some items may already be approved)"
            fi
          else
            echo "No items to approve"
          fi

      - name: "Phase 2 - Coverage gaps"
        if: inputs.phases == 'all' || inputs.phases == '2'
        run: |
          echo ""
          echo "-- Coverage gaps (pre-design) --"
          kane-cli cover gaps || echo "Gaps will appear after test design"

      - name: "Phase 2 - Graph after review"
        if: inputs.phases == 'all' || inputs.phases == '2'
        run: kane-cli context list || true

      # ===========================================================
      # PHASE 3: Test Design
      # kane-cli: design tests
      # ===========================================================
      - name: "Phase 3 - Design tests"
        if: inputs.phases == 'all' || inputs.phases == '3'
        timeout-minutes: 60
        run: |
          echo ""
          echo "================================================"
          echo "  Phase 3: Test Design"
          echo "  Max tests per use-case: ${{ inputs.max_tests }}"
          echo "================================================"
          echo ""

          MAX="${{ inputs.max_tests }}"
          if ! [[ "$MAX" =~ ^[0-9]+$ ]]; then
            echo "ERROR: max_tests must be a number, got: $MAX"
            exit 1
          fi

          kane-cli context list --json > graph.json 2>graph-stderr.log

          echo "=== Raw graph ==="
          cat graph.json
          echo ""

          # Find use-cases: label == "usecase", or an id/ref starting with uc-
          mapfile -t usecases < <(jq -s -r \
            '[.[] | select(.label == "usecase" or (.id // "" | startswith("uc-")) or (.ref // "" | startswith("uc-")))] | .[] | (.ref // .id // .slug)' \
            graph.json 2>/dev/null)

          if [ "${#usecases[@]}" -eq 0 ]; then
            echo "No type-based matches - trying uc- prefix on all fields"
            mapfile -t usecases < <(jq -s -r \
              '[.[] | (.ref // .id // .slug // .name // empty)] | .[] | select(startswith("uc-"))' \
              graph.json 2>/dev/null)
          fi

          if [ "${#usecases[@]}" -eq 0 ]; then
            echo "No use-cases found. Full graph:"
            cat graph.json
            exit 0
          fi

          TARGET_USECASE="${{ inputs.target_usecase }}"
          if [ -n "$TARGET_USECASE" ]; then
            if printf '%s\n' "${usecases[@]}" | grep -qx "$TARGET_USECASE"; then
              echo "Targeting single use-case: $TARGET_USECASE (of ${#usecases[@]} total)"
              usecases=("$TARGET_USECASE")
            else
              echo "ERROR: target_usecase '$TARGET_USECASE' not found in graph. Available:"
              printf '  %s\n' "${usecases[@]}"
              exit 1
            fi
          fi

          echo "Use-cases to design:"
          printf '  %s\n' "${usecases[@]}"
          echo ""

          total=${#usecases[@]}
          current=0
          for uc in "${usecases[@]}"; do
            current=$((current + 1))
            step_start=$(date +%s)
            echo "-- [$current/$total] Designing: $uc (max $MAX) -- started $(date '+%H:%M:%S')"

            # Direct invocation, no piping/capturing into a variable - this
            # pattern has proven stable for 30+ minute design sessions.
            kane-cli design tests --use-case "$uc" --mode override --max "$MAX" --allow-unreviewed
            exit_code=$?

            # Exit code 3 = paused and resumable (per kane-cli's documented
            # exit codes). Look up the session id via a separate, safe,
            # file-redirected JSON call - never by capturing this command's
            # own output stream.
            resume_attempts=0
            while [ "$exit_code" -eq 3 ] && [ "$resume_attempts" -lt 3 ]; do
              resume_attempts=$((resume_attempts + 1))
              kane-cli context sessions --json > sessions.json 2>sessions-err.log

              echo "=== Raw sessions.json (attempt $resume_attempts) ==="
              cat sessions.json

              session_id=$(jq -s -r '[.[] | (.id // .session_id // .ref // empty)] | .[-1] // empty' sessions.json 2>/dev/null)

              if [ -n "$session_id" ]; then
                echo "   Session paused (exit 3) - auto-resuming (attempt $resume_attempts/3): $session_id"
                kane-cli design tests --resume "$session_id" --mode override
                exit_code=$?
              else
                echo "   Could not find a paused session id - stopping retries"
                break
              fi
            done

            if [ "$exit_code" -eq 3 ]; then
              echo "   WARNING: $uc still paused after $resume_attempts resume attempts - check manually with: kane-cli context sessions"
            fi

            step_end=$(date +%s)
            elapsed=$((step_end - step_start))
            if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 3 ]; then
              echo "Design for $uc completed with warnings (exit $exit_code)"
            fi
            echo "-- [$current/$total] Done: $uc -- took $((elapsed / 60))m $((elapsed % 60))s"
            echo ""
          done

      - name: "Phase 3 - Approve designed tests"
        if: inputs.phases == 'all' || inputs.phases == '3'
        run: |
          kane-cli context list --json > post-design-items.json 2>graph-stderr.log

          # Only items awaiting review (trust: derived) are approvable - this
          # correctly targets newly-designed tests/ACs/scenarios while
          # skipping use-cases already approved in phase 2.
          jq -s '[.[] | select(.trust == "derived") | {ref: (.ref // .id // .slug // .name), resolution: "approved"}]' \
            post-design-items.json > verdicts.json 2>/dev/null || echo "[]" > verdicts.json

          item_count=$(jq 'length' verdicts.json 2>/dev/null || echo "0")
          if [ "$item_count" -gt 0 ]; then
            echo "Approving $item_count items..."
            kane-cli context review --verdicts verdicts.json
            if [ $? -ne 0 ]; then
              echo "Review completed"
            fi
          else
            echo "No items to approve"
          fi

      - name: "Phase 3 - List test files"
        if: inputs.phases == 'all' || inputs.phases == '3'
        run: |
          echo "-- Designed test files --"
          if [ -d ".testmuai/tests" ]; then
            find .testmuai/tests -name '*_test.md' | sort
            echo "Total: $(find .testmuai/tests -name '*_test.md' | wc -l) test files"
          else
            echo "No test files generated"
          fi

      - name: "Phase 3 - Scan for unresolved variables (across ALL tests)"
        if: inputs.phases == 'all' || inputs.phases == '3'
        run: |
          echo ""
          echo "================================================"
          echo "  Unresolved variables across all designed tests"
          echo "================================================"
          echo ""
          echo "Variable names are minted fresh per design session -"
          echo "the AI does not reuse a fixed vocabulary, even for"
          echo "conceptually identical fixtures. This scan reads the"
          echo "actual test files instead of guessing names in advance."
          echo ""
          echo "NOTE: fill new values in .testmuai/variables/zz-fixtures.json,"
          echo "NOT assurance.json - design sessions regenerate that file."
          echo "zz-fixtures.json loads after it alphabetically and wins."
          echo ""

          if [ ! -d ".testmuai/tests" ]; then
            echo "No .testmuai/tests directory - run phase 3 design first"
            exit 0
          fi

          VARS_DIR=".testmuai/variables"

          # Extract every unique {{variable}} placeholder across all test files
          mapfile -t all_vars < <(grep -ohE '\{\{[a-zA-Z0-9_]+\}\}' .testmuai/tests/*_test.md 2>/dev/null \
            | sed 's/[{}]//g' | sort -u)

          if [ "${#all_vars[@]}" -eq 0 ]; then
            echo "No variables found in any designed test"
            exit 0
          fi

          echo "Variable files present (loaded alphabetically, later overrides earlier):"
          ls -la "$VARS_DIR"/*.json 2>/dev/null || echo "  (none)"
          echo ""
          echo "Found ${#all_vars[@]} unique variable(s):"
          echo ""

          missing_count=0
          for var in "${all_vars[@]}"; do
            # Merge ALL *.json files the same way kane-cli does: alphabetical
            # order, later files override earlier ones for duplicate keys.
            value=$(jq -s -r --arg v "$var" 'add | .[$v].value // empty' "$VARS_DIR"/*.json 2>/dev/null)

            used_by=$(grep -l "{{$var}}" .testmuai/tests/*_test.md 2>/dev/null \
              | xargs -n1 basename 2>/dev/null | tr '\n' ',' | sed 's/,$//')

            if [ -z "$value" ]; then
              missing_count=$((missing_count + 1))
              echo "  [MISSING] $var"
              echo "            used by: $used_by"
            else
              echo "  [OK]      $var = $value"
            fi
          done

          echo ""
          if [ "$missing_count" -gt 0 ]; then
            echo "$missing_count variable(s) still need values."
            echo "Fill these locally (via Claude Code) before running phase 4 -"
            echo "see docs/local-phases-4-6.md"
          else
            echo "All variables resolved - ready for local phase 4"
          fi

      # ===========================================================
      # PHASE 7: Maintenance
      # kane-cli: maintain reconcile
      # ===========================================================
      - name: "Phase 7 - Reconcile PRD change"
        if: inputs.phases == 'all' || inputs.phases == '7'
        timeout-minutes: 10
        run: |
          echo ""
          echo "================================================"
          echo "  Phase 7: Maintenance"
          echo "  Reconciling: ${{ inputs.v2_prd }}"
          echo "================================================"
          echo ""

          echo "-- BEFORE reconcile --"
          kane-cli context list || echo "Empty graph"
          echo ""

          kane-cli maintain reconcile --from "./${{ inputs.v2_prd }}" --source-id "${{ inputs.source_id }}" --mode override
          if [ $? -ne 0 ]; then
            echo "Reconcile completed with warnings"
          fi

          echo ""
          echo "-- AFTER reconcile --"
          kane-cli context list

          echo ""
          echo "-- Coverage gaps after reconcile --"
          kane-cli cover gaps || echo "No gaps"

      # -- Save state & artifacts --------------------------
      - name: "Generate context graph"
        if: always()
        run: |
          kane-cli context view --output context-graph.html || echo "Graph generation skipped"

      - name: "Summary"
        if: always()
        run: |
          echo ""
          echo "================================================"
          echo "  Run complete: phase ${{ inputs.phases }}"
          echo "  Next: run phases 4-6 locally via Claude Code"
          echo "  (see docs/local-phases-4-6.md)"
          echo "================================================"

      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlc-design-${{ inputs.phases }}-${{ github.run_number }}
          retention-days: 30
          path: |
            context-graph.html
            all-items.json
            verdicts.json
            graph.json
            verify-ingest.json
            .context/
            .testmuai/
