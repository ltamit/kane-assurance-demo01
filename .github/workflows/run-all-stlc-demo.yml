name: "Run All · Full STLC Demo"

# ─────────────────────────────────────────────────────────
# Runs all STLC phases in sequence on a SINGLE machine.
# Each phase is a separate step so the prospect can see
# clear boundaries in the Actions log.
#
# Trigger manually: Actions → Run All · Full STLC Demo → Run workflow
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'PRD file path'
        required: true
        default: 'docs/prd-checkout.md'
      source_id:
        description: 'Source ID'
        required: true
        default: 'prd-checkout'
      app_url:
        description: 'ShopEasy app URL (set to "skip" to skip phases 4-5)'
        required: true
        default: 'skip'
      max_tests:
        description: 'Max tests per use-case'
        required: true
        default: '3'

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  full-stlc-demo:
    name: "Full STLC Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Setup ──────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "Setup: Install Kane CLI"
        run: |
          npm install -g @testmuai/kane-cli
          kane-cli --version
          kane-cli install skill || true

      - name: "Setup: Authenticate"
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: "Setup: Install Chrome (for phases 4-5)"
        if: inputs.app_url != 'skip'
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          google-chrome --version

      # ────────────────────────────────────────────────────
      # PHASE 1: Requirements Analysis
      # kane-cli: context ingest + context extract
      # ────────────────────────────────────────────────────
      - name: "Phase 1 · Ingest PRD"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 1: Requirements Analysis"
          echo "  Ingesting: ${{ inputs.source_file }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli context ingest "./${{ inputs.source_file }}" \
            --as "${{ inputs.source_id }}" \
            --mode ci

      - name: "Phase 1 · Extract use-cases"
        run: |
          echo "Extracting use-cases from: ${{ inputs.source_id }}"
          kane-cli context extract \
            --mode override \
            --source "${{ inputs.source_id }}"

      - name: "Phase 1 · Show extracted use-cases"
        run: |
          echo ""
          echo "── Extracted use-cases ──"
          kane-cli context list

      # ────────────────────────────────────────────────────
      # PHASE 2: Test Planning
      # kane-cli: context review + cover gaps
      # ────────────────────────────────────────────────────
      - name: "Phase 2 · Review and approve use-cases"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 2: Test Planning"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Get all items and build verdicts file
          kane-cli context list --json > /tmp/all-items.json 2>/dev/null || echo "[]" > /tmp/all-items.json

          echo "Items in context graph:"
          cat /tmp/all-items.json | jq '.' 2>/dev/null || cat /tmp/all-items.json
          echo ""

          # Build approve-all verdicts
          jq '[.[] | select(.ref != null) | {ref: .ref, resolution: "approved"}]' \
            /tmp/all-items.json > /tmp/verdicts.json 2>/dev/null || echo "[]" > /tmp/verdicts.json

          ITEM_COUNT=$(jq 'length' /tmp/verdicts.json 2>/dev/null || echo "0")

          if [ "$ITEM_COUNT" -gt "0" ]; then
            echo "Approving $ITEM_COUNT items..."
            kane-cli context review --verdicts /tmp/verdicts.json \
              || echo "Review completed (some items may already be approved)"
          else
            echo "No items to approve"
          fi

      - name: "Phase 2 · Coverage gaps before design"
        run: |
          echo ""
          echo "── Coverage gaps (pre-design) ──"
          kane-cli cover gaps 2>/dev/null \
            || echo "Gaps will appear after test design"

      - name: "Phase 2 · Graph status after review"
        run: kane-cli context list

      # ────────────────────────────────────────────────────
      # PHASE 3: Test Design
      # kane-cli: design tests
      # ────────────────────────────────────────────────────
      - name: "Phase 3 · Design tests for all use-cases"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 3: Test Design"
          echo "  Max tests per use-case: ${{ inputs.max_tests }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          MAX=${{ inputs.max_tests }}

          # Get all refs from the graph
          kane-cli context list --json > /tmp/graph.json 2>/dev/null || echo "[]" > /tmp/graph.json

          # Try multiple strategies to find use-case refs
          USECASES=$(jq -r '.[] | select(
            .type == "use-case" or
            .type == "use_case" or
            (.ref // "" | startswith("uc-"))
          ) | .ref // .id // empty' /tmp/graph.json 2>/dev/null || true)

          # Fallback: grep for uc- prefixed refs
          if [ -z "$USECASES" ]; then
            echo "Trying fallback: all refs starting with uc-"
            USECASES=$(jq -r '.[] | .ref // .id // empty' /tmp/graph.json 2>/dev/null | grep '^uc-' || true)
          fi

          if [ -z "$USECASES" ]; then
            echo "⚠️ No use-cases found. Graph contents:"
            cat /tmp/graph.json | jq '.' 2>/dev/null || cat /tmp/graph.json
            echo ""
            echo "Skipping design phase"
          else
            echo "Use-cases to design:"
            echo "$USECASES"
            echo ""

            TOTAL=$(echo "$USECASES" | wc -l | tr -d ' ')
            CURRENT=0

            for UC in $USECASES; do
              CURRENT=$((CURRENT + 1))
              echo ""
              echo "── [$CURRENT/$TOTAL] Designing: $UC (max $MAX) ──"
              kane-cli design tests \
                --use-case "$UC" \
                --mode override \
                --max "$MAX" \
                --allow-unreviewed \
                || echo "⚠️ Design for $UC completed with warnings"
            done
          fi

      - name: "Phase 3 · Approve designed tests"
        run: |
          kane-cli context list --json > /tmp/all-items.json 2>/dev/null || echo "[]" > /tmp/all-items.json
          jq '[.[] | select(.ref != null) | {ref: .ref, resolution: "approved"}]' \
            /tmp/all-items.json > /tmp/verdicts.json 2>/dev/null || echo "[]" > /tmp/verdicts.json
          ITEM_COUNT=$(jq 'length' /tmp/verdicts.json 2>/dev/null || echo "0")
          if [ "$ITEM_COUNT" -gt "0" ]; then
            kane-cli context review --verdicts /tmp/verdicts.json \
              || echo "Review completed"
          fi

      - name: "Phase 3 · List designed test files"
        run: |
          echo ""
          echo "── Designed test files ──"
          if [ -d ".testmuai/tests" ]; then
            find .testmuai/tests -name '*_test.md' | sort
            echo ""
            echo "Total: $(find .testmuai/tests -name '*_test.md' | wc -l | tr -d ' ') test files"
          else
            echo "No test files generated"
          fi

      # ────────────────────────────────────────────────────
      # PHASE 4: Test Development (requires running app)
      # kane-cli: testmd run
      # ────────────────────────────────────────────────────
      - name: "Phase 4 · Author tests in a real browser"
        if: inputs.app_url != 'skip'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 4: Test Development"
          echo "  App URL: ${{ inputs.app_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          TESTS=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | head -3)
          if [ -z "$TESTS" ]; then
            echo "No test files found — skipping"
            exit 0
          fi

          for TEST in $TESTS; do
            echo "── Authoring: $(basename $TEST) ──"
            kane-cli testmd run "$TEST" \
              --url "${{ inputs.app_url }}" \
              --headless \
              || echo "⚠️ Authoring completed with issues"
            echo ""
          done

      - name: "Phase 4 · Skipped (no app URL)"
        if: inputs.app_url == 'skip'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 4: Test Development — SKIPPED"
          echo "  Set app_url to a live URL to enable"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ────────────────────────────────────────────────────
      # PHASE 5: Test Execution (requires running app)
      # kane-cli: testrun run
      # ────────────────────────────────────────────────────
      - name: "Phase 5 · Batch replay tests"
        if: inputs.app_url != 'skip'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 5: Test Execution"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli testrun run \
            --match 't-' \
            --url "${{ inputs.app_url }}" \
            --headless \
            || echo "⚠️ Some tests may have failed — check evidence"

      - name: "Phase 5 · Skipped (no app URL)"
        if: inputs.app_url == 'skip'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 5: Test Execution — SKIPPED"
          echo "  Set app_url to a live URL to enable"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ────────────────────────────────────────────────────
      # PHASE 6: Coverage & Reporting
      # kane-cli: cover + cover gaps
      # ────────────────────────────────────────────────────
      - name: "Phase 6 · Coverage report"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Phase 6: Coverage & Reporting"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "── Coverage panel ──"
          kane-cli cover 2>/dev/null || echo "No evidence packs yet"
          echo ""
          echo "── Coverage gaps ──"
          kane-cli cover gaps 2>/dev/null || echo "No gaps to report"

      - name: "Phase 6 · Save JSON outputs"
        run: |
          kane-cli cover --json > coverage.json 2>/dev/null || echo "{}" > coverage.json
          kane-cli cover gaps --json > coverage-gaps.json 2>/dev/null || echo "[]" > coverage-gaps.json

      - name: "Phase 6 · Generate context graph"
        run: kane-cli context view --output context-graph.html 2>/dev/null || true

      # ── Summary & Artifacts ─────────────────────────────
      - name: "Pipeline complete"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  ✅ Full STLC demo pipeline complete"
          echo ""
          echo "  Phase 1: Requirements Analysis  ✓"
          echo "  Phase 2: Test Planning           ✓"
          echo "  Phase 3: Test Design             ✓"
          if [ "${{ inputs.app_url }}" != "skip" ]; then
            echo "  Phase 4: Test Development        ✓"
            echo "  Phase 5: Test Execution          ✓"
          else
            echo "  Phase 4: Test Development        ⏭ skipped"
            echo "  Phase 5: Test Execution          ⏭ skipped"
          fi
          echo "  Phase 6: Coverage & Reporting    ✓"
          echo ""
          echo "  Next: Run workflow 7 (Maintenance)"
          echo "  with prd-checkout-v2.md to see"
          echo "  how the suite handles PRD changes"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlc-demo-output-${{ github.run_number }}
          retention-days: 30
          path: |
            coverage.json
            coverage-gaps.json
            context-graph.html
            .context/
            .testmuai/
