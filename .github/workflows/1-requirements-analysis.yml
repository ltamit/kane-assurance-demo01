name: "1 · Requirements Analysis"

# ─────────────────────────────────────────────────────────
# STLC Phase: Requirements Analysis
# Kane CLI:   context ingest + context extract
#
# What it demonstrates:
#   - Ingesting a PRD into the local context graph
#   - AI agent reading the PRD and extracting use-cases
#   - Every use-case cited back to the exact source line
#   - Clarifying questions when the PRD is ambiguous
#
# What the prospect should notice:
#   - The AI doesn't invent requirements — it cites them
#   - Ambiguities are surfaced, not silently guessed
#   - The output is structured, not a wall of text
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'Requirement doc path (relative to repo root)'
        required: true
        default: 'docs/prd-checkout.md'
      source_id:
        description: 'Source ID in the context graph'
        required: true
        default: 'prd-checkout'
      mode:
        description: 'override = accept all defaults, ci = fail on ambiguity'
        required: true
        default: 'override'
        type: choice
        options: [override, ci]

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  requirements-analysis:
    name: Ingest & Extract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli && kane-cli --version

      - name: Authenticate
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Restore context graph
        uses: actions/cache@v4
        with:
          path: .context/
          key: context-${{ hashFiles('docs/**') }}-${{ github.run_number }}
          restore-keys: context-${{ hashFiles('docs/**') }}-

      # ── INGEST ─────────────────────────────────────────
      - name: "Ingest: Snapshot the requirement document"
        run: |
          echo "📄 Ingesting: ${{ inputs.source_file }}"
          echo "   Source ID: ${{ inputs.source_id }}"
          echo ""
          kane-cli context ingest \
            "./${{ inputs.source_file }}" \
            --as "${{ inputs.source_id }}" \
            --mode ci

      # ── EXTRACT ────────────────────────────────────────
      - name: "Extract: AI reads the PRD and proposes use-cases"
        run: |
          echo "🤖 Extracting use-cases from: ${{ inputs.source_id }}"
          echo "   Mode: ${{ inputs.mode }}"
          echo ""
          kane-cli context extract \
            --mode ${{ inputs.mode }} \
            --source "${{ inputs.source_id }}"

      # ── SHOW RESULTS ───────────────────────────────────
      - name: "Result: List extracted use-cases"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Extracted use-cases"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kane-cli context list

      - name: Save context graph listing
        run: kane-cli context list --json > context-list.json

      - name: Generate visual graph
        run: kane-cli context view --output context-graph.html 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1-requirements-analysis-${{ github.run_number }}
          retention-days: 30
          path: |
            context-list.json
            context-graph.html
            .context/
